<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Simple Gallery</title>
    <meta name="description" content="Responsive gallery one-page template template">
    <meta name="keywords" content="gallery, gallery template, html5 template, css3 template">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="shortcut icon" href="static/images/favicons/favicon.png" type="image/x-icon">
    <link rel="apple-touch-icon" href="static/images/favicons/apple-touch-icon.png">
    <link rel="apple-touch-icon-precomposed" href="static/images/favicons/apple-touch-icon-precomposed.png">
    <link href="https://fonts.googleapis.com/css?family=PT+Sans&subset=latin,cyrillic|PT+Serif&subset=latin,cyrillic" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="static/css/screen.min.css">
</head>
<body>
    <header class="page-header">
        <div class="page-header__inner">
            <div class="page-header__group">
                <h1 class="page-header__title">My Awesome Street Art Gallery</h1>
            </div>
        </div>
    </header>

    <div class="page-content">
        <main class="page-content__main">
            <section class="page-content__gallery">
                <div class="gallery">
                    <div class="gallery__inner">
                        <div class="gallery__flow">

                            <!-- Gallery Item Start -->
                            <div class="gallery__isle">
                                <div class="gallery__isle-inner" style="padding-bottom:auto;"> <!-- 去掉固定比例 -->
                                    <div class="gallery__isle-content">
                                        <figure class="gallery__preview">
                                            <div class="gallery__preview-image">
                                                <img src="static/images/Mu_Images/Bags/1.jpg" alt="street art" style="height:auto; width:100%;">
                                            </div>
                                            <figcaption class="gallery__preview-caption">
                                                <div class="gallery__preview-info">
                                                    <h2 class="gallery__preview-title">Some Awesome Street Art</h2>
                                                    <div class="gallery__preview-links">
                                                        <a class="gallery__preview-link gallery__preview-link_role_original" href="https://unsplash.com/search/photos/street-art?photo=GiTA965K380">View original</a>
                                                        <a class="gallery__preview-link gallery__preview-link_role_author" href="#">AuthorName</a>
                                                        <a class="gallery__preview-link gallery__preview-link_role_photographer" href="https://unsplash.com/@ckturistando">ckturistando</a>
                                                    </div>
                                                </div>
                                            </figcaption>
                                        </figure>
                                    </div>
                                </div>
                            </div>
                            <!-- Gallery Item End -->


                            <!-- 其他图片可以按上面格式继续添加 -->
                            <!-- Gallery Item Start -->
                            <div class="gallery__isle">
                                <div class="gallery__isle-inner">
                                    <div class="gallery__isle-content">
                                        <figure class="gallery__preview">
                                            <div class="gallery__preview-image">
                                                <img src="static/images/blocks/gallery/ckturistando-335312.jpg" alt="street art">
                                            </div>
                                            <figcaption class="gallery__preview-caption">
                                                <div class="gallery__preview-info">
                                                    <h2 class="gallery__preview-title">Some Awesome Street Art</h2>
                                                    <div class="gallery__preview-links">
                                                        <a class="gallery__preview-link gallery__preview-link_role_original" href="https://unsplash.com/search/photos/street-art?photo=GiTA965K380">View original</a>
                                                        <a class="gallery__preview-link gallery__preview-link_role_author" href="#">AuthorName</a>
                                                        <a class="gallery__preview-link gallery__preview-link_role_photographer" href="https://unsplash.com/@ckturistando">ckturistando</a>
                                                    </div>
                                                </div>
                                            </figcaption>
                                        </figure>
                                    </div>
                                </div>
                            </div>
                            <!-- Gallery Item End -->

                            <!-- 你可以继续添加更多图片，按上面的 <div class="gallery__isle"> 模板 -->

                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <footer class="page-footer">
        <div class="page-footer__inner">
            <div class="page-footer__group">
                <p class="page-footer__text">
                    <a class="page-footer__text-link" href="https://website-templates.github.io/simple-gallery_responsive-template/">Simple Gallery</a>
                </p>
                <p class="page-footer__text">
                    Designed by&nbsp;<a class="page-footer__text-link" href="https://github.com/orlovmax">Maxim Orlov</a>
                </p>
            </div>
        </div>
    </footer>
</body>
</html>
